<!-- =========================
     MAIN CONTENT
========================== -->

<main class="middle-content">

    <main class="elements-page">
        <header class="page-header">
            <div>
                
                <h1>Interactive Periodic Table</h1>
                <p>Click any of the 118 elements to explore its atomic, electronic and chemical properties.</p>
            </div>
            <div class="search-wrap">
                <input id="elementSearch" type="search" placeholder="Search element, symbol, number or category..." autocomplete="off">
                <div class="search-count" id="searchCount" aria-live="polite"></div>
            </div>
        </header>

        <section class="legend" id="legend" aria-label="Filter by category"></section>
        <section class="periodic-table" id="periodicTable" aria-label="Periodic Table"></section>

        <div class="modal-backdrop" id="elementModal" hidden>
            <article class="element-modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
                <button class="close-btn" id="closeModal" aria-label="Close">×</button>
                <div class="element-hero" id="elementHero"></div>
                <div class="property-grid" id="propertyGrid"></div>
                <section class="detail-section">
                    <h2>⚛ Atomic Structure</h2>
                    <div class="atomic-layout">
                        <div class="atom-card" id="atomDiagram"></div>
                        <div class="structure-text" id="structureText"></div>
                    </div>
                </section>
                <section class="detail-section">
                    <h2>🔬 Hybridization &amp; Geometry</h2>
                    <div class="hybrid-grid" id="hybridization"></div>
                </section>
                <section class="detail-section">
                    <h2>🧪 Chemistry &amp; Pharmaceutical Relevance</h2>
                    <div class="chemistry-info" id="chemistryInfo"></div>
                </section>
                <nav class="modal-nav">
                    <button id="prevBtn" type="button">‹ Previous</button>
                    <button id="nextBtn" type="button">Next ›</button>
                </nav>
            </article>
        </div>
    </main>
    <script src="js/elements-data.js"></script>
    <script src="js/elements.js"></script>
</body>
